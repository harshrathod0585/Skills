description = "Unified model proxy management (/auto-gear start | status | set | stop)"
prompt = """
Follow the `auto-gear` skill instructions based on the user's subcommand:
- `/auto-gear start` -> Check port 8787 and start node proxy.js in background.
- `/auto-gear status` -> Query http://127.0.0.1:8787/stats and display live stats.
- `/auto-gear set` -> Interactively configure max model ceiling and save to ~/.claude/model-policy.json.
- `/auto-gear stop` -> Terminate proxy process on port 8787.
"""
